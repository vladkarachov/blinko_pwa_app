name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blinko-pwa
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 21 (required by Capacitor 8 / AGP)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Resolve version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="$(node -p "require('./package.json').version")"
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "APP_VERSION=${VERSION}" >> "$GITHUB_ENV"
          # versionCode must grow monotonically for Android updates.
          # run_number is unique and always increasing per workflow.
          echo "VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "VERSION_NAME=${VERSION}" >> "$GITHUB_ENV"
          echo "version=${VERSION} versionCode=${GITHUB_RUN_NUMBER}" >> "$GITHUB_STEP_SUMMARY"

      - name: Install dependencies
        run: bun install

      - name: Build web assets
        run: bun run build

      - name: Capacitor sync
        run: bunx cap sync android

      - name: Build debug APK
        working-directory: blinko-pwa/android
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "VERSION_CODE=$VERSION_CODE VERSION_NAME=$VERSION_NAME"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK with version
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk \
            "blinko_pwa_${VERSION}.apk"
          ls -la *.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: blinko-pwa-${{ env.VERSION }}
          path: blinko-pwa/blinko_pwa_${{ env.VERSION }}.apk

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: blinko-pwa/blinko_pwa_${{ env.VERSION }}.apk
          generate_release_notes: true
